name: Windows 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run icon
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeskField-Setup
          path: release/*.exe
          if-no-files-found: error

      # 태그를 밀면 릴리스에도 올린다.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*.exe
