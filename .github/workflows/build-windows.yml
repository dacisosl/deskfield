name: Windows 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# 릴리스를 만들려면 쓰기 권한이 필요하다.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run icon
      - run: npm run dist

      # package.json의 버전을 태그 이름으로 쓴다.
      - id: meta
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DeskField-Setup
          path: release/*.exe
          if-no-files-found: error

      # 태그가 없으면 액션이 현재 커밋에 태그를 만들고 릴리스를 올린다.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 바탕 필드 v${{ steps.meta.outputs.version }}
          body: |
            ### 받는 방법 (권장 순서)

            1. **`바탕 필드-${{ steps.meta.outputs.version }}-win.zip`** — 압축을 풀고 `DeskField.exe` 실행. 설치 과정이 없어 보안 프로그램에 막힐 단계가 가장 적습니다.
            2. `DeskField-Setup-${{ steps.meta.outputs.version }}.exe` — 설치판 (바탕화면·시작 메뉴 바로가기 생성)
            3. `DeskField-${{ steps.meta.outputs.version }}-portable.exe` — 무설치 단일 실행 파일

            서명이 없어서 SmartScreen이 한 번 막을 수 있습니다 — **추가 정보 → 실행**으로 넘어가면 됩니다.
            실행이 안 되면 `%APPDATA%\DeskField\startup.log`를 확인해 주세요.
          files: |
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: true
