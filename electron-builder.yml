appId: com.dacisosl.deskfield
productName: 바탕 필드
copyright: © dacisosl

directories:
  output: release
  buildResources: build

# 압축을 최대로 — zip 용량이 눈에 띄게 준다 (빌드는 조금 느려진다)
compression: maximum
# 언어팩은 한국어·영어만 담는다 (수십 개 언어 × 총 ~45MB 절감)
electronLanguages: [ko, en-US]

files:
  - dist/**
  - build/icon.png
  - package.json

win:
  # zip: NSIS 같은 32비트 압축 실행기 없이 앱을 그대로 담는다.
  # 보안 프로그램이 서명 없는 NSIS 스텁을 조용히 차단하는 환경에서도 실행된다.
  target: [zip, nsis, portable]
  icon: build/icon.png
  # 실행 파일명은 영문으로 — 한글 exe 이름이 만들 수 있는 변수를 없앤다.
  executableName: DeskField
  # zip 파일명도 영문으로 (GitHub 릴리스가 한글 파일명을 잘라먹는다)
  artifactName: DeskField-${version}-win.${ext}

nsis:
  artifactName: DeskField-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 바탕 필드
  deleteAppDataOnUninstall: false

portable:
  artifactName: DeskField-${version}-portable.${ext}
